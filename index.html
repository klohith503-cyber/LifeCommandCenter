<!DOCTYPE html>
<html>
<head>
<title>Life Command Center</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:30px;
}
.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0px 4px 20px rgba(0,0,0,0.1);
}
h1{
text-align:center;
}
.input-area{
display:flex;
gap:10px;
}
input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid gray;
font-size:16px;
}
button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}
.task{
background:#eef2ff;
padding:10px;
margin-top:10px;
border-radius:10px;
}
</style>
</head>
<body>
<div class="container">
<h1>🚀 Life Command Center</h1>
<form action="/add" method="post">
<div class="input-area">
<input
name="task"
placeholder="Enter your task"
required
>
<button type="submit">
Add Task
</button>
</div>
</form>
<h2>Your Tasks</h2>
{% for task in tasks %}
<div class="task">
{{task}}
</div>
{% endfor %}
</div>
</body>
</html>
